name: "QGIS 4 compatibility"

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "metadata.txt"
      - ".github/workflows/qgis4-check.yml"

  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - "metadata.txt"
      - ".github/workflows/qgis4-check.yml"

env:
  PROJECT_FOLDER: "."

jobs:
  qgis4-check:
    name: PyQGIS 4 Checker
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Run PyQGIS 4 migration check
        run: |
          # Dry run creates a readable report but intentionally exits 0 even
          # when incompatibilities are found.
          pyqt5_to_pyqt6.py --dry_run --logfile pyqgis4-checker.log ${{ env.PROJECT_FOLDER }}/

          # The edit-enabled pass is the check used by the upstream project.
          # It only modifies this disposable CI checkout. Capture its status so
          # we can also detect any rewritten source through git diff.
          set +e
          pyqt5_to_pyqt6.py ${{ env.PROJECT_FOLDER }}/
          checker_status=$?
          set -e

          if [ "$checker_status" -ne 0 ] || ! git diff --quiet; then
            echo "PyQGIS 4 checker found compatibility changes."
            exit 1
          fi

      - name: Upload report if checker fails
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: pyqgis4-checker-report
          path: pyqgis4-checker.log
          retention-days: 7
