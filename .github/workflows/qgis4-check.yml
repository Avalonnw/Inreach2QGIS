name: "QGIS 4 compatibility"

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "metadata.txt"
      - ".github/workflows/qgis4-check.yml"

  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - "metadata.txt"
      - ".github/workflows/qgis4-check.yml"

env:
  PROJECT_FOLDER: "."

jobs:
  qgis4-check:
    name: PyQGIS 4 Checker
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Run PyQGIS 4 migration check
        run: |
          pyqt5_to_pyqt6.py --dry_run --logfile pyqgis4-checker.log ${{ env.PROJECT_FOLDER }}/
          pyqt5_to_pyqt6.py ${{ env.PROJECT_FOLDER }}/

      - name: Upload report if checker fails
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: pyqgis4-checker-report
          path: pyqgis4-checker.log
          retention-days: 7
